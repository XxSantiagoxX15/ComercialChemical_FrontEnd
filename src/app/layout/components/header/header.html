<mat-toolbar class="app-header">
  <span class="header-title">
    <mat-icon class="header-icon">science</mat-icon>
    Comercial Chemical S.A.S.
  </span>
  <span class="spacer"></span>

  <div class="user-section">
    <mat-icon class="user-icon">account_circle</mat-icon>
    <span class="user-name">{{ userName }}</span>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
  </div>

  <mat-menu #userMenu="matMenu">
    <div class="menu-user-info">
      <mat-icon>person</mat-icon>
      <div>
        <div class="menu-user-name">{{ userName }}</div>
        <div class="menu-user-email">{{ userEmail }}</div>
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
